<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<input class="file-input" id="import-input" type="file" accept=".json,application/json" />
<script>
'use strict';
const KEY='be-yeu-data-v1', SELECT_KEY='be-yeu-active-v1';
const NAV=[['home','🏡','Tổng quan'],['growth','📏','Tăng trưởng'],['food','🍼','Ăn uống'],['vaccine','💉','Tiêm chủng'],['medicine','🩹','Dùng thuốc'],['fever','🌡️','Cơn sốt'],['cabinet','🗄️','Tủ thuốc'],['data','📁','Dữ liệu']];
const $=s=>document.querySelector(s);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const id=()=> typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const localDate=(d=new Date())=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const localDateTime=(d=new Date())=>`${localDate(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const parseDate=v=>{if(!v)return null;const d=new Date(String(v).length===10?String(v)+'T12:00:00':String(v));return Number.isNaN(d.getTime())?null:d};
const fmtDate=v=>{const d=parseDate(v);return d?d.toLocaleDateString('vi-VN'):'—'};
const fmtDateTime=v=>{const d=parseDate(v);return d?d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'}):'—'};
const fmtTime=v=>{const d=parseDate(v);return d?d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'—'};
const fmtMoney=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Number(n)||0)+' ₫';
const fmtNum=(n,d=1)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});
const num=v=>v===''||v===null||v===undefined?null:Number(v);
const monthsBetween=(birth,when=localDate())=>{const a=parseDate(birth),b=parseDate(when);if(!a||!b)return 0;let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return Math.max(0,m)};
const ageLabel=(birth,date=localDate())=>{const m=monthsBetween(birth,date);return m<12?`${m} tháng tuổi`:`${Math.floor(m/12)} tuổi${m%12?' '+m%12+' tháng':''}`};
const sexLabel=x=>x==='male'?'Bé trai':x==='female'?'Bé gái':'Khác';
const avatar=x=>x==='male'?'👶🏻':x==='female'?'👶🏼':'🧸';
const arr=x=>Array.isArray(x)?x:[];
const cleanText=(x,max=600)=>String(x??'').slice(0,max);
const uniqueRecords=(items)=>arr(items).filter(x=>x&&typeof x==='object').slice(0,15000).map(x=>({...x,id:cleanText(x.id||id(),100)}));
function normalizeBaby(b){return {id:cleanText(b.id||id(),100),name:cleanText(b.name,130),birthDate:cleanText(b.birthDate,30),sex:['male','female','other'].includes(b.sex)?b.sex:'other',birthWeight:num(b.birthWeight),birthLength:num(b.birthLength),growth:uniqueRecords(b.growth),formulas:uniqueRecords(b.formulas),milk:uniqueRecords(b.milk),meals:uniqueRecords(b.meals),vaccines:uniqueRecords(b.vaccines),meds:uniqueRecords(b.meds),fevers:uniqueRecords(b.fevers),createdAt:cleanText(b.createdAt||new Date().toISOString(),36)}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');return d&&Array.isArray(d.babies)?{version:1,inventory:uniqueRecords(d.inventory),babies:d.babies.slice(0,250).filter(x=>x&&typeof x==='object'&&x.name&&x.birthDate).map(normalizeBaby)}:{version:1,inventory:[],babies:[]}}catch{return {version:1,inventory:[],babies:[]}}}
let db=load(),selectedId='',tab='home',foodMode='all',importMode='merge',toastTimer=null,persistent=true;
try{selectedId=localStorage.getItem(SELECT_KEY)||'';localStorage.setItem('__be_test','ok');localStorage.removeItem('__be_test')}catch{persistent=false}
if(!db.babies.some(b=>b.id===selectedId))selectedId=db.babies[0]?.id||'';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(SELECT_KEY,selectedId);persistent=true}catch(err){persistent=false;notify('Không lưu được vào trình duyệt. Hãy xuất tệp sao lưu JSON ngay.','error')}}
function baby(){return db.babies.find(b=>b.id===selectedId)||null}
function notify(message,type=''){const root=$('#toast-root');root.innerHTML=`<div class="toast ${type}">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',4200)}
function sortBy(items,key,desc=true){return [...arr(items)].sort((a,b)=>desc?String(b[key]||'').localeCompare(String(a[key]||'')):String(a[key]||'').localeCompare(String(b[key]||'')))}
function addDays(iso,days){const d=parseDate(iso);if(!d)return '';d.setDate(d.getDate()+days);return localDate(d)}
function diffDays(a,b){const x=parseDate(a),y=parseDate(b);return x&&y?Math.round((x-y)/86400000):0}
function lastGrowth(b,key){const points=sortBy(b.growth.filter(x=>num(x[key])!==null&&Number.isFinite(Number(x[key]))),'date');return points[0]||null}
function growthPair(b,key){const list=sortBy(b.growth.filter(x=>num(x[key])!==null&&Number.isFinite(Number(x[key]))),'date');if(key==='weight'&&num(b.birthWeight)!==null&&!list.some(x=>x.date===b.birthDate))list.push({date:b.birthDate,weight:b.birthWeight,isBirth:true});if(key==='height'&&num(b.birthLength)!==null&&!list.some(x=>x.date===b.birthDate))list.push({date:b.birthDate,height:b.birthLength,isBirth:true});return sortBy(list,'date')}
function growthValue(b,key){const rec=lastGrowth(b,key);return rec?num(rec[key]):key==='weight'?num(b.birthWeight):num(b.birthLength)}
function recentMilk(b){const now=Date.now()-24*3600000;return b.milk.filter(x=>{const d=parseDate(x.dateTime);return d&&d.getTime()>=now&&d.getTime()<=Date.now()}).reduce((sum,x)=>sum+(Number(x.ml)||0),0)}
function vaccineState(v){if(v.done)return ['Đã tiêm','green'];const d=diffDays(v.planDate,localDate());return d<0?['Quá ngày dự kiến','red']:d<=7?['Sắp đến lịch','orange']:['Chưa tiêm','blue']}
function doseKeys(m){const days=Math.max(0,Math.min(120,Number(m.days)||0)),freq=Math.max(0,Math.min(8,Number(m.frequency)||0));const keys=[];for(let j=0;j<days;j++)for(let k=0;k<freq;k++)keys.push(`${addDays(m.startDate,j)}|${k+1}`);return keys}
function stat(icon,label,value,foot){return `<div class="card stat-card"><div class="stat-icon">${icon}</div><div class="stat-title">${esc(label)}</div><div class="stat-value">${esc(value)}</div><div class="stat-foot">${esc(foot)}</div></div>`}
function heading(title,btnLabel,action){return `<div class="section-heading"><h2 class="section-title">${esc(title)}</h2>${btnLabel?`<button class="btn btn-primary btn-small" data-action="add" data-kind="${action}">＋ ${esc(btnLabel)}</button>`:''}</div>`}
function empty(icon,title,detail){return `<div class="empty"><span class="empty-icon">${icon}</span><h3>${esc(title)}</h3><p>${esc(detail)}</p></div>`}
function actions(kind,entryId){return `<div class="cell-actions"><button class="btn btn-small btn-ghost" data-action="edit" data-kind="${kind}" data-id="${esc(entryId)}" title="Chỉnh sửa">✏️ Sửa</button><button class="btn btn-small btn-ghost btn-danger" data-action="delete" data-kind="${kind}" data-id="${esc(entryId)}" title="Xóa">🗑️ Xóa</button></div>`}
function headerTitle(){return ({home:'Tổng quan của bé',growth:'Theo dõi tăng trưởng',food:'Sổ tay ăn uống',vaccine:'Lịch tiêm chủng',medicine:'Theo dõi dùng thuốc',fever:'Theo dõi cơn sốt',data:'Quản lý dữ liệu'})[tab]}
function navMarkup(){return NAV.map(([k,icon,label])=>`<button class="nav-btn ${tab===k?'active':''}" data-action="tab" data-tab="${k}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}
function shell(content){return `<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-logo">🧸</span><div><div class="brand-title">Bé Yêu</div><div class="brand-sub">NHẬT KÝ CHĂM SÓC</div></div></div><div><div class="sidebar-label">Sổ theo dõi</div><nav class="nav-list" style="margin-top:12px">${navMarkup()}</nav></div><div class="side-bottom">💛 Những khoảnh khắc bé lớn lên đều đáng được lưu giữ.<br><br>Thông tin chỉ được lưu trên trình duyệt này. Nhớ sao lưu thường xuyên.</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">CÙNG BÉ KHÔN LỚN MỖI NGÀY</div><h1 class="page-title">${esc(headerTitle())}</h1></div><div class="top-actions"><select class="btn baby-select" id="baby-selector" aria-label="Chọn bé">${db.babies.length?db.babies.map(b=>`<option value="${esc(b.id)}" ${b.id===selectedId?'selected':''}>👶 ${esc(b.name)}</option>`).join(''):'<option>Chưa có hồ sơ</option>'}</select><button class="btn btn-soft" data-action="add" data-kind="baby">＋ Thêm bé</button>${baby()?`<button class="btn btn-icon" data-action="edit" data-kind="baby" data-id="${esc(selectedId)}" title="Sửa hồ sơ bé">✏️</button>`:''}</div></header>${!persistent?'<div class="banner">⚠️ Trình duyệt đang không cho lưu dữ liệu lâu dài. Bạn có thể nhập thông tin rồi xuất bản sao lưu JSON, hoặc thử mở ứng dụng bằng trang web HTTPS.</div>':''}${content}<div class="footer">Bé Yêu 💗 · Sổ theo dõi gia đình · Không thay thế tư vấn của nhân viên y tế</div></main></div><nav class="mobile-nav">${NAV.map(([k,icon,label])=>`<button data-action="tab" data-tab="${k}" class="${tab===k?'active':''}"><span>${icon}</span>${label}</button>`).join('')}</nav>`}
function stockUsed(itemId){let used=0;for(const b of db.babies){for(const m of b.meds){if(m.cabinetId!==itemId)continue;const q=Number(m.stockQty)||1;if(m.kind==='rx')used+=Object.keys(m.taken||{}).filter(k=>m.taken[k]).length*q;else used+=q}for(const f of b.fevers){if(f.medUsed&&f.cabinetId===itemId)used+=(Number(f.stockQty)||1)}}return used}
function stockLeft(itemId){const item=db.inventory.find(x=>x.id===itemId);return item?(Number(item.quantity)||0)-stockUsed(itemId):null}
function cabinetSelector(obj){return `<div class="form-field full">${selectField('Nguồn thuốc','source',obj.cabinetId?'cabinet':'external',[['external','Thuốc theo đơn / mua ngoài tủ'],['cabinet','Lấy từ tủ thuốc']])}</div><div class="form-field full" id="cabinet-choice">${selectField('Chọn thuốc trong tủ','cabinetId',obj.cabinetId||'',[['','— Chọn thuốc —'],...db.inventory.map(x=>[x.id,`${x.name} · còn ${fmtNum(stockLeft(x.id))} ${x.unit} · HSD ${fmtDate(x.expiry)}`])])}${field('Số lượng trừ cho mỗi lần dùng','stockQty','number',obj.stockQty??1,{min:.01,step:'.01',required:true})}</div>`}
function renderCabinet(){const items=sortBy(db.inventory,'name',false);return `${heading('🗄️ Tủ thuốc gia đình','Thêm thuốc','cabinet')}<div class="inline-note warning">Tủ thuốc dùng chung cho tất cả hồ sơ bé. Số tồn = số lượng nhập − số lượng đã ghi nhận sử dụng. Thuốc hết hạn hoặc không đủ tồn sẽ không thể ghi nhận dùng thêm.</div><div class="card">${items.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Tên thuốc</th><th>Hạn dùng</th><th>Mục đích / liều ghi nhận</th><th>Tồn kho</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${fmtDate(x.expiry)} ${x.expiry<localDate()?'<span class="pill red">Hết hạn</span>':''}</td><td>${esc(x.purpose||'—')}<br>${esc(x.dose||'')}</td><td><b>${fmtNum(stockLeft(x.id))} ${esc(x.unit)}</b> ${stockLeft(x.id)<=0?'<span class="pill red">Hết thuốc</span>':''}</td><td>${actions('cabinet',x.id)}</td></tr>`).join('')}</tbody></table></div>`:empty('🗄️','Tủ thuốc đang trống','Nhấn Thêm thuốc để nhập số lượng, đơn vị và hạn dùng.')}</div>`}
function validateStock(kind,oldRecord,newRecord){const affected=new Set([oldRecord?.cabinetId,newRecord?.cabinetId].filter(Boolean));for(const itemId of affected){const item=db.inventory.find(x=>x.id===itemId);if(!item)throw Error('Thuốc trong tủ không còn tồn tại.');let delta=0;const usage=r=>{if(!r||r.cabinetId!==itemId)return 0;const q=Number(r.stockQty)||1;return kind==='fever'?(r.medUsed?q:0):r.kind==='rx'?Object.values(r.taken||{}).filter(Boolean).length*q:q};delta=usage(newRecord)-usage(oldRecord);if(delta>0&&item.expiry<localDate())throw Error('Thuốc trong tủ đã hết hạn.');if(stockLeft(itemId)<delta-0.00001)throw Error('Không đủ thuốc trong tủ. Còn '+fmtNum(stockLeft(itemId))+' '+item.unit)}}
function render(){const b=baby();const content=!b?renderWelcome():(tab==='home'?renderHome(b):tab==='growth'?renderGrowth(b):tab==='food'?renderFood(b):tab==='vaccine'?renderVaccines(b):tab==='medicine'?renderMedicines(b):tab==='fever'?renderFevers(b):tab==='cabinet'?renderCabinet():renderData());$('#app').innerHTML=shell(content)}
function renderWelcome(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">CHÀO MỪNG BẠN</div><div class="hero-name">Bắt đầu nhật ký của bé 💞</div><p>Thêm hồ sơ bé đầu tiên để ghi lại những dấu mốc đáng nhớ.</p><button style="margin-top:17px" class="btn btn-primary" data-action="add" data-kind="baby">＋ Tạo hồ sơ bé</button></div><div class="hero-avatar">👶</div></div><div class="card">${empty('🧸','Một nơi cho cả gia đình','Quản lý nhiều bé cùng lúc, lưu tăng trưởng, cữ sữa, bữa ăn, mũi tiêm và các lần dùng thuốc.')}</div>${tab==='data'?renderData():''}`}
function renderHero(b){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">HỒ SƠ ĐANG THEO DÕI</div><div class="hero-name">Xin chào, ${esc(b.name)}! 💗</div><p>${sexLabel(b.sex)} · Sinh ngày ${fmtDate(b.birthDate)} · <b>${ageLabel(b.birthDate)}</b><br>Cân nặng lúc sinh: ${b.birthWeight!=null?fmtNum(b.birthWeight)+' kg':'Chưa nhập'}</p></div><div class="hero-avatar">${avatar(b.sex)}</div></div>`}
function renderHome(b){const lastW=lastGrowth(b,'weight'),lastH=lastGrowth(b,'height');const vacc=sortBy(b.vaccines.filter(x=>!x.done),'planDate',false);const recent=[...b.milk.map(x=>({date:x.dateTime,title:`${x.ml||0} ml sữa · ${x.milkName||'Cữ sữa'}`,icon:'🍼'})),...b.meals.map(x=>({date:x.dateTime,title:`${x.name||x.type} · ${x.menu||''}`,icon:'🥣'})),...b.growth.map(x=>({date:x.date,title:'Cập nhật cân nặng / chiều cao',icon:'📏'})),...b.vaccines.filter(x=>x.done).map(x=>({date:x.actualDate||x.planDate,title:`Đã ghi nhận tiêm: ${x.name}`,icon:'💉'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);const activeRx=b.meds.filter(x=>x.kind==='rx'&&doseKeys(x).some(k=>!((x.taken||{})[k]))).length;return `${renderHero(b)}${renderAlerts(b)}<div class="stats-grid">${stat('⚖️','Cân nặng gần nhất',growthValue(b,'weight')!==null?fmtNum(growthValue(b,'weight'))+' kg':'—',lastW?`Đo ngày ${fmtDate(lastW.date)}`:'Chỉ số lúc sinh / chưa ghi')}${stat('📐','Chiều cao gần nhất',growthValue(b,'height')!==null?fmtNum(growthValue(b,'height'))+' cm':'—',lastH?`Đo ngày ${fmtDate(lastH.date)}`:'Chưa có số đo mới')}${stat('🍼','Sữa trong 24 giờ',fmtNum(recentMilk(b),0)+' ml',`${b.milk.length} cữ sữa đã lưu`)}${stat('💉','Mũi tiêm chưa hoàn thành',String(vacc.length),`${activeRx} đợt thuốc kê đơn đang theo dõi`)}</div><div class="two-col" style="margin-top:18px"><section class="card"><div class="section-heading" style="margin:0 0 7px"><h2 class="card-title">✨ Nhật ký gần đây</h2><button class="btn btn-small btn-soft" data-action="tab" data-tab="food">Nhập bữa ăn</button></div>${recent.length?recent.map(x=>`<div class="activity-item"><div class="activity-emoji">${x.icon}</div><div class="activity-body"><div class="activity-name">${esc(x.title)}</div><div class="activity-meta">${fmtDateTime(x.date)}</div></div></div>`).join(''):empty('📝','Chưa có hoạt động','Hãy bắt đầu ghi số đo, cữ sữa hoặc lịch tiêm cho bé.')}</section><section class="card"><h2 class="card-title">🗓️ Lịch tiêm sắp tới</h2><p class="card-sub">Các lịch bạn đã tự nhập</p>${vacc.length?vacc.slice(0,5).map(v=>`<div class="activity-item"><div class="activity-emoji">💉</div><div class="activity-body"><div class="activity-name">${esc(v.name)}</div><div class="activity-meta">Dự kiến ${fmtDate(v.planDate)}</div></div><span class="pill ${vaccineState(v)[1]}">${vaccineState(v)[0]}</span></div>`).join(''):empty('🌷','Không có lịch chờ','Thêm lịch tiêm trong mục Tiêm chủng.')}<button class="btn btn-small btn-soft" data-action="tab" data-tab="vaccine">Xem lịch tiêm →</button></section></div><div class="section-heading"><h2 class="section-title">Truy cập nhanh</h2></div><div class="split-layout"><div class="callout-cta"><div><b>📏 Cập nhật chỉ số của bé</b><p class="card-sub">Theo dõi sự thay đổi qua từng lần đo.</p></div><button class="btn btn-primary btn-small" data-action="add" data-kind="growth">＋ Số đo</button></div><div class="callout-cta"><div><b>🩹 Ghi nhận lần dùng thuốc</b><p class="card-sub">Lưu liều dùng và các lần đã uống.</p></div><button class="btn btn-primary btn-small" data-action="add" data-kind="medicine">＋ Thuốc</button></div></div>`}
function renderChart(b,key,title,unit){const pts=growthPair(b,key).filter(x=>Number.isFinite(Number(x[key]))).reverse();const W=520,H=206,padL=38,padR=16,padT=18,padB=32;if(!pts.length)return `<div class="card"><h3 class="card-title">${title}</h3>${empty('📊','Chưa có biểu đồ','Nhập số đo để theo dõi biểu đồ.')}</div>`;const data=pts.slice(-24).map((p,i)=>({x:i,value:Number(p[key]),date:p.date})),vals=data.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(max-min,key==='weight'?.5:2),lo=Math.max(0,min-range*.25),hi=max+range*.25,x=i=>padL+(data.length===1?(W-padL-padR)/2:i*(W-padL-padR)/(data.length-1)),y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);const grid=[0,1,2,3,4].map(i=>{const yy=padT+i*(H-padT-padB)/4;return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#f1eeef"/><text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#aaa0a6">${fmtNum(hi-i*(hi-lo)/4)}</text>`}).join('');const poly=data.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ');const points=data.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="4.5" fill="#e98e7c" stroke="white" stroke-width="2"><title>${fmtDate(p.date)}: ${p.value} ${unit}</title></circle>`).join('');const labels=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="11" fill="#aba1a7">${fmtDate(data[i].date).slice(0,5)}</text>`).join('');return `<div class="card"><h3 class="card-title">${title}</h3><p class="card-sub">Các mốc đã ghi (đơn vị: ${unit})</p><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ ${title}">${grid}<polyline points="${poly}" fill="none" stroke="#e98e7c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${points}${labels}</svg></div>`}
function growthComment(b,key,unit){const list=growthPair(b,key),latest=list[0],prev=list[1];if(!latest)return `Chưa có ${key==='weight'?'cân nặng':'chiều cao'} để so sánh.`;if(!prev)return `Đã lưu số đo ${fmtNum(latest[key])} ${unit} ngày ${fmtDate(latest.date)}. Hãy ghi thêm lần đo để theo dõi xu hướng.`;const delta=Number(latest[key])-Number(prev[key]),days=Math.abs(diffDays(latest.date,prev.date)),sign=delta>0?'tăng':delta<0?'giảm':'không thay đổi';return `${key==='weight'?'Cân nặng':'Chiều cao'} ${sign} ${fmtNum(Math.abs(delta),2)} ${unit} so với lần đo trước (${fmtDate(prev.date)}${days?', cách '+days+' ngày':''}).${delta<0?' Bạn có thể kiểm tra lại cách đo và hỏi nhân viên y tế nếu có lo ngại.':''}`}
function renderGrowth(b){const records=sortBy(b.growth,'date');return `${renderHero(b)}${heading('Các chỉ số tăng trưởng','Thêm số đo','growth')}<div class="stats-grid">${stat('⚖️','Cân nặng',growthValue(b,'weight')!==null?fmtNum(growthValue(b,'weight'))+' kg':'—','Lần gần nhất / lúc sinh')}${stat('📏','Chiều cao',growthValue(b,'height')!==null?fmtNum(growthValue(b,'height'))+' cm':'—','Lần đo gần nhất')}${stat('📅','Tuổi hiện tại',ageLabel(b.birthDate),'Dựa trên ngày sinh')}${stat('🗒️','Lần đo đã lưu',String(b.growth.length),'Có thể sửa hoặc xóa')}</div><div class="charts-grid" style="margin-top:16px">${renderChart(b,'weight','Cân nặng của bé','kg')}${renderChart(b,'height','Chiều cao của bé','cm')}</div><div class="card" style="margin-top:16px"><h3 class="card-title">💬 Nhận xét thay đổi</h3><div class="summary-bullets"><div class="summary-line"><i class="dot"></i><span>${esc(growthComment(b,'weight','kg'))}</span></div><div class="summary-line"><i class="dot"></i><span>${esc(growthComment(b,'height','cm'))}</span></div></div><div class="inline-note warning">Đây là so sánh giữa các lần đo của <b>chính bé</b>, không phải chẩn đoán hoặc đánh giá chuẩn tăng trưởng theo tuổi/giới. Để đối chiếu biểu đồ tăng trưởng chuẩn WHO, hãy nhờ bác sĩ hoặc nhân viên y tế kiểm tra.</div></div>${heading('Lịch sử đo lường')}<div class="card">${records.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày đo</th><th>Tuổi lúc đo</th><th>Cân nặng</th><th>Chiều cao</th><th>Ghi chú</th><th></th></tr></thead><tbody>${records.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${ageLabel(b.birthDate,x.date)}</td><td>${num(x.weight)!=null?fmtNum(x.weight)+' kg':'—'}</td><td>${num(x.height)!=null?fmtNum(x.height)+' cm':'—'}</td><td>${esc(x.note||'—')}</td><td>${actions('growth',x.id)}</td></tr>`).join('')}</tbody></table></div>`:empty('📏','Chưa có lần đo','Nhấn Thêm số đo để tạo bản ghi đầu tiên.')}</div>`}
function renderFood(b){const formulas=sortBy(b.formulas,'name',false),milk=sortBy(b.milk,'dateTime'),meals=sortBy(b.meals,'dateTime');return `${renderHero(b)}<div class="mode-strip"><button class="mode-pill ${foodMode==='all'?'active':''}" data-action="food-mode" data-mode="all">Tất cả</button><button class="mode-pill ${foodMode==='milk'?'active':''}" data-action="food-mode" data-mode="milk">🍼 Sữa</button><button class="mode-pill ${foodMode==='meal'?'active':''}" data-action="food-mode" data-mode="meal">🥣 Ăn dặm & bữa phụ</button></div>${foodMode==='all'||foodMode==='milk'?`${heading('Danh mục sữa đang dùng','Thêm loại sữa','formula')}<div class="card">${formulas.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Tên sữa</th><th>Độ tuổi ghi trên sản phẩm</th><th>Cách pha ghi trên nhãn</th><th>Ghi chú</th><th></th></tr></thead><tbody>${formulas.map(f=>`<tr><td><b>${esc(f.name)}</b></td><td>${f.ageFrom!==''&&f.ageFrom!=null?esc(f.ageFrom)+' tháng':''}${f.ageTo!==''&&f.ageTo!=null?' – '+esc(f.ageTo)+' tháng':''}${f.ageFrom==null&&f.ageTo==null?'—':''}</td><td>${f.scoops!=null&&f.waterMl!=null?`${fmtNum(f.scoops)} muỗng / ${fmtNum(f.waterMl,0)} ml nước`:'Chưa nhập'}</td><td>${esc(f.note||'—')}</td><td>${actions('formula',f.id)}</td></tr>`).join('')}</tbody></table></div>`:empty('🍼','Chưa lưu loại sữa','Lưu tên sữa, nhóm tuổi và hướng dẫn pha đúng theo nhãn sản phẩm.')}</div><div class="inline-note warning">Chỉ ghi lại <b>hướng dẫn pha trên bao bì sản phẩm</b> hoặc chỉ định chuyên môn; ứng dụng không tự đưa ra tỷ lệ pha sữa.</div>${heading('Nhật ký các cữ sữa','Thêm cữ sữa','milk')}<div class="card">${milk.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày, giờ</th><th>Tên sữa</th><th>Lượng đã uống</th><th>Ghi chú</th><th></th></tr></thead><tbody>${milk.map(m=>`<tr><td>${fmtDateTime(m.dateTime)}</td><td>${esc(m.milkName||'—')}</td><td><b>${fmtNum(m.ml,0)} ml</b></td><td>${esc(m.note||'—')}</td><td>${actions('milk',m.id)}</td></tr>`).join('')}</tbody></table></div>`:empty('🥛','Chưa ghi cữ sữa','Lưu từng cữ sữa theo thời gian và số ml thực uống.')}</div>`:''}${foodMode==='all'||foodMode==='meal'?`${heading('Bữa ăn dặm và ăn phụ','Thêm bữa ăn','meal')}${monthsBetween(b.birthDate)<6?`<div class="inline-note warning">🌱 Bé hiện ${ageLabel(b.birthDate)}. Ăn bổ sung thường bắt đầu vào khoảng <b>6 tháng tuổi</b>; nếu bé cần thời điểm khác, hãy trao đổi với nhân viên y tế. Bạn vẫn có thể dùng sổ để ghi lịch sử ăn uống.</div>`:''}<div class="card">${meals.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày, giờ</th><th>Loại bữa</th><th>Tên bữa</th><th>Thực đơn</th><th>Ghi chú</th><th></th></tr></thead><tbody>${meals.map(m=>`<tr><td>${fmtDateTime(m.dateTime)}</td><td><span class="pill ${m.type==='Phụ / ăn vặt'?'orange':'green'}">${esc(m.type)}</span></td><td><b>${esc(m.name)}</b></td><td>${esc(m.menu)}</td><td>${esc(m.note||'—')}</td><td>${actions('meal',m.id)}</td></tr>`).join('')}</tbody></table></div>`:empty('🥣','Chưa có bữa ăn','Lưu tên bữa, giờ ăn, thực đơn và ghi chú.')}</div>`:''}`}
function renderVaccines(b){const rows=sortBy(b.vaccines,'planDate',false),cost=rows.reduce((sum,v)=>sum+(Number(v.cost)||0),0),completed=rows.filter(v=>v.done).length;return `${renderHero(b)}<div class="stats-grid">${stat('📅','Tổng lịch tiêm',String(rows.length),'Số lịch bạn đã nhập')}${stat('✅','Đã hoàn thành',String(completed),'Đánh dấu sau khi tiêm')}${stat('⏳','Chưa hoàn thành',String(rows.length-completed),'Theo dõi lịch dự kiến')}${stat('💰','Chi phí ghi nhận',fmtMoney(cost),'Tổng các khoản đã nhập')}</div>${heading('Lịch tiêm của bé','Thêm mũi tiêm','vaccine')}<div class="inline-note">Lịch tiêm được gia đình tự nhập để nhắc nhớ và ghi chép, không phải lịch tiêm được khuyến nghị tự động. Đối chiếu lịch, thời điểm và phản ứng sau tiêm với cơ sở tiêm chủng.</div><div class="card"><div class="vaccine-list">${rows.length?rows.map(v=>`<div class="vaccine-row"><div class="vaccine-main"><h3>${esc(v.name)} <span class="pill ${vaccineState(v)[1]}">${vaccineState(v)[0]}</span></h3><p>📅 Dự kiến: ${fmtDate(v.planDate)} ${v.done&&v.actualDate?' · Đã tiêm: '+fmtDate(v.actualDate):''}</p><p>💰 ${fmtMoney(v.cost)} ${v.note?' · '+esc(v.note):''}</p>${v.postNote?`<p>📝 Sau tiêm: ${esc(v.postNote)}</p>`:''}</div><div><label class="check-wrap"><input type="checkbox" data-action="toggle-vaccine" data-id="${esc(v.id)}" ${v.done?'checked':''} /> Đã tiêm</label><div style="margin-top:10px">${actions('vaccine',v.id)}</div></div></div>`).join(''):empty('💉','Chưa có lịch tiêm','Thêm ngày dự kiến, tên mũi tiêm và chi phí nếu có.')}</div></div>`}
function renderMedicines(b){const medicines=sortBy(b.meds,'kind',false);const rx=sortBy(medicines.filter(m=>m.kind==='rx'),'startDate'),otc=sortBy(medicines.filter(m=>m.kind==='otc'),'dateTime');return `${renderHero(b)}${heading('Theo dõi thuốc của bé','Thêm thuốc / lần dùng','medicine')}<div class="inline-note warning">Chức năng này dùng để <b>ghi chép</b>, không tự chỉ định thuốc hoặc tính liều. Với trẻ nhỏ, kể cả thuốc không kê đơn, hãy kiểm tra với bác sĩ/dược sĩ trước khi dùng. Nếu có dấu hiệu bất thường hoặc nghi dùng quá liều, cần liên hệ nhân viên y tế ngay.</div><div class="stats-grid">${stat('📋','Đợt thuốc kê đơn',String(rx.length),'Lưu số ngày và số lần / ngày')}${stat('💊','Lần dùng không kê đơn',String(otc.length),'Nhật ký từng lần sử dụng')}${stat('✅','Liều kê đơn đã đánh dấu',String(rx.reduce((s,m)=>s+doseKeys(m).filter(k=>Boolean((m.taken||{})[k])).length,0)),'Tính theo ô đã tích')}${stat('🗓️','Liều kê đơn theo kế hoạch',String(rx.reduce((s,m)=>s+doseKeys(m).length,0)),'Số ngày × số lần / ngày')}</div>${heading('Thuốc có kê đơn')}${rx.length?rx.map(renderRx).join(''):`<div class="card">${empty('💊','Chưa có đơn thuốc','Thêm tên thuốc, liều dùng và thời gian dùng theo đơn được kê.')}</div>`}${heading('Nhật ký thuốc không kê đơn')}<div class="card">${otc.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày, giờ dùng</th><th>Tên thuốc</th><th>Liều đã dùng</th><th>Nhiệt độ</th><th>Chỉ số / ghi chú</th><th></th></tr></thead><tbody>${otc.map(m=>`<tr><td>${fmtDateTime(m.dateTime)}</td><td><b>${esc(m.name)}</b></td><td>${esc(m.dose)}</td><td>${m.temperature!=null?fmtNum(m.temperature)+' °C':'—'}</td><td>${esc([m.indicators,m.note].filter(Boolean).join(' · ')||'—')}</td><td>${actions('medicine',m.id)}</td></tr>`).join('')}</tbody></table></div>`:empty('🩹','Chưa ghi nhận lần dùng','Thêm từng lần dùng thuốc không kê đơn và ghi rõ liều lượng.')}</div>`}
function stockTag(m){if(!m.cabinetId)return '';const item=db.inventory.find(x=>x.id===m.cabinetId);return item?`<span class="pill blue">🗄️ Tủ thuốc · còn ${fmtNum(stockLeft(item.id))} ${esc(item.unit)}</span>`:'<span class="pill orange">Thuốc đã xóa khỏi tủ</span>'}function renderRx(m){const slots=doseKeys(m),taken=m.taken||{},done=slots.filter(k=>taken[k]).length,pct=slots.length?Math.round(done/slots.length*100):0,times=Array.isArray(m.times)?m.times:[];const days=Array.from({length:Math.max(0,Math.min(120,Number(m.days)||0))},(_,i)=>{const date=addDays(m.startDate,i);return `<div class="dose-day"><h4>📆 ${fmtDate(date)} · Ngày ${i+1}</h4>${Array.from({length:Math.max(0,Math.min(8,Number(m.frequency)||0))},(_,j)=>{const k=`${date}|${j+1}`;return `<label class="dose-item"><input type="checkbox" data-action="toggle-dose" data-id="${esc(m.id)}" data-slot="${k}" ${taken[k]?'checked':''} /><span>${esc(times[j]||'Lần '+(j+1))}${taken[k]?'<span style="color:#529071"> · Đã dùng</span>':''}</span></label>`}).join('')}</div>`}).join('');return `<article class="card medicine-card"><div class="medicine-head"><div><h3>💊 ${esc(m.name)} <span class="pill blue">Có kê đơn</span> ${stockTag(m)}</h3><div class="medicine-meta">Liều dùng theo đơn: <b>${esc(m.dose)}</b><br>Bắt đầu: ${fmtDate(m.startDate)} · ${Number(m.days)||0} ngày · ${Number(m.frequency)||0} lần/ngày${times.length?' · Giờ: '+esc(times.join(', ')):''}</div></div>${actions('medicine',m.id)}</div>${m.temperature!=null||m.indicators||m.note?`<div class="med-notes">${m.temperature!=null?'🌡️ Nhiệt độ ghi nhận: '+fmtNum(m.temperature)+' °C<br>':''}${m.indicators?'📋 Chỉ số khác: '+esc(m.indicators)+'<br>':''}${m.note?'📝 '+esc(m.note):''}</div>`:''}<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><p class="subtle">${done}/${slots.length} lần đã đánh dấu (${pct}%) · Các ô tích không thay thế xác nhận của nhân viên y tế.</p><details class="dose-details" data-medid="${esc(m.id)}"><summary>🗓️ Xem và đánh dấu từng lần dùng</summary><div class="dose-days">${days}</div></details></article>`}
function renderFevers(b){const rows=sortBy(b.fevers,'dateTime');return `${renderHero(b)}${heading('Nhật ký theo dõi cơn sốt','Thêm lần đo','fever')}<div class="inline-note warning">Nhật ký chỉ để ghi nhận, không chẩn đoán hoặc đề xuất thuốc. Đặc biệt, trẻ dưới 3 tháng tuổi sốt từ 38°C cần được đánh giá y tế ngay.</div><div class="card">${rows.length?rows.map(x=>`<div class="activity-item"><div class="activity-emoji">🌡️</div><div class="activity-body"><div class="activity-name">${fmtNum(x.temperature)} °C · ${fmtDateTime(x.dateTime)}</div><div class="activity-meta">Thuốc hạ sốt: ${x.medUsed?'Đã dùng':'Chưa dùng'}${x.followTime?' · Kiểm tra lại '+fmtDateTime(x.followTime)+': '+(x.followTemperature==null?'Chưa nhập':fmtNum(x.followTemperature)+' °C'):''}</div><div class="activity-meta">${esc(x.note||'')}</div></div><div>${actions('fever',x.id)}</div></div>`).join(''):empty('🌡️','Chưa có lần đo','Thêm nhiệt độ và thời gian để theo dõi diễn biến cơn sốt.')}</div>`}
function renderAlerts(b){const upcoming=b.vaccines.filter(v=>!v.done&&v.planDate&&diffDays(v.planDate,localDate())>=0&&diffDays(v.planDate,localDate())<=30).sort((a,z)=>a.planDate.localeCompare(z.planDate));const overdue=b.vaccines.filter(v=>!v.done&&v.planDate&&diffDays(v.planDate,localDate())<0);const missing=b.meds.filter(m=>m.kind==='rx').flatMap(m=>doseKeys(m).filter(k=>!m.taken?.[k]&&String(k).slice(0,10)<=localDate()).map(k=>({m,k}))).slice(0,20);return `<section class="card" style="margin-top:18px"><h2 class="card-title">🔔 Thông báo chăm sóc</h2><p class="card-sub">Lịch tiêm trong 30 ngày tới và các ô liều thuốc chưa được đánh dấu (theo lịch đã nhập).</p><h3>💉 Lịch tiêm trong 30 ngày (${upcoming.length})</h3>${upcoming.length?upcoming.map(v=>`<div class="activity-item"><div class="activity-body"><b>${esc(v.name)}</b><div class="activity-meta">${fmtDate(v.planDate)} · Còn ${diffDays(v.planDate,localDate())} ngày</div></div></div>`).join(''):'<p>Không có lịch tiêm trong 30 ngày tới.</p>'}${overdue.length?`<p class="inline-note warning">Có ${overdue.length} lịch tiêm đã qua ngày dự kiến nhưng chưa đánh dấu hoàn thành.</p>`:''}<h3 style="margin-top:18px">💊 Liều thuốc chưa đánh dấu (${missing.length}${missing.length===20?'+':''})</h3>${missing.length?missing.map(x=>`<div class="activity-item"><div class="activity-body"><b>${esc(x.m.name)}</b><div class="activity-meta">Mốc: ${esc(x.k)} · Chưa tích đã dùng</div></div></div>`).join(''):'<p>Không có liều thuốc đến hạn chưa được đánh dấu.</p>'}<div class="inline-note">Chưa đánh dấu không có nghĩa chắc chắn bé đã bỏ liều. Kiểm tra lại thực tế; không tự uống bù hoặc dùng gấp đôi liều.</div></section>`}
function renderData(){return `<div class="card"><h2 class="card-title">📦 Sao lưu và chuyển dữ liệu</h2><p class="card-sub">Tất cả hồ sơ bé, số đo, sữa, bữa ăn, tiêm chủng và thuốc được lưu trong <b>trình duyệt trên thiết bị đang dùng</b>. Không tự đồng bộ giữa các thiết bị.</p><div class="data-actions"><button class="btn btn-primary" data-action="export">⬇️ Xuất JSON sao lưu</button><button class="btn btn-soft" data-action="import" data-mode="merge">⬆️ Nhập JSON (gộp hồ sơ mới)</button><button class="btn" data-action="import" data-mode="replace">♻️ Khôi phục (thay tất cả)</button></div><div class="inline-note warning">⚠️ Hãy xuất bản sao lưu định kỳ và giữ tệp tại nơi an toàn. Dữ liệu về sức khỏe của bé có tính riêng tư. Chế độ <b>khôi phục</b> sẽ xóa toàn bộ dữ liệu hiện có trên trình duyệt này và thay bằng tệp được nhập.</div></div>${heading('Các hồ sơ bé')}${db.babies.length?`<div class="profile-list">${db.babies.map(b=>`<button class="profile-card ${b.id===selectedId?'active':''}" data-action="select-baby" data-id="${esc(b.id)}"><span class="profile-circle">${avatar(b.sex)}</span><span><b>${esc(b.name)}</b><small>${ageLabel(b.birthDate)} · ${fmtDate(b.birthDate)}</small><small>${b.growth.length} số đo · ${b.milk.length} cữ sữa</small></span></button>`).join('')}</div>`:empty('👶','Chưa có hồ sơ bé','Thêm hồ sơ đầu tiên để bắt đầu.')}<div class="card" style="margin-top:20px"><div class="section-heading" style="margin:0"><h2 class="card-title">🛟 Bảo vệ dữ liệu</h2><button class="btn btn-small" data-action="export">Sao lưu ngay</button></div><div class="summary-bullets"><div class="summary-line"><span class="dot"></span><span>Ứng dụng hoạt động không cần tài khoản, không tự tải dữ liệu của bé lên máy chủ.</span></div><div class="summary-line"><span class="dot"></span><span>Nếu xóa dữ liệu website, sử dụng chế độ ẩn danh hoặc đổi thiết bị, nhật ký có thể biến mất nếu chưa sao lưu.</span></div><div class="summary-line"><span class="dot"></span><span>Để chuyển sang máy khác, chọn <b>Xuất JSON</b> trên máy cũ rồi <b>Nhập JSON</b> trên máy mới.</span></div></div></div>`}
// Field generators keep all text escaped; values are always strings in HTML attributes.
const field=(label,name,type='text',val='',opts={})=>`<div class="form-field ${opts.full?'full':''}"><label for="f-${name}">${esc(label)}${opts.required?' *':''}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(val??'')}" ${opts.min!==undefined?`min="${esc(opts.min)}"`:''} ${opts.max!==undefined?`max="${esc(opts.max)}"`:''} ${opts.step!==undefined?`step="${esc(opts.step)}"`:''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''} ${opts.required?'required':''}/>${opts.hint?`<span class="hint">${esc(opts.hint)}</span>`:''}</div>`;
const area=(label,name,val='',opts={})=>`<div class="form-field ${opts.full!==false?'full':''}"><label for="f-${name}">${esc(label)}${opts.required?' *':''}</label><textarea id="f-${name}" name="${name}" ${opts.required?'required':''} placeholder="${esc(opts.placeholder||'')}">${esc(val||'')}</textarea></div>`;
const selectField=(label,name,value,options,opts={})=>`<div class="form-field ${opts.full?'full':''}"><label for="f-${name}">${esc(label)}${opts.required?' *':''}</label><select id="f-${name}" name="${name}" ${opts.required?'required':''}>${options.map(([v,txt])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(txt)}</option>`).join('')}</select></div>`;
const boolField=(label,name,value=false)=>`<label class="form-switch"><input type="checkbox" name="${name}" ${value?'checked':''}/>${esc(label)}</label>`;
function modalBody(kind,obj={},isEdit=false){const b=baby(),t=localDate(),dt=localDateTime();switch(kind){case 'cabinet':return `<div class="form-grid">${field('Tên thuốc','name','text',obj.name||'',{required:true,full:true})}${field('Hạn sử dụng','expiry','date',obj.expiry||'',{required:true})}${field('Số lượng ban đầu','quantity','number',obj.quantity??0,{required:true,min:0,step:'.01'})}${field('Đơn vị (gói, viên, ml...)','unit','text',obj.unit||'gói',{required:true})}${area('Mục đích sử dụng','purpose',obj.purpose||'')}${area('Liều dùng ghi trên đơn / nhãn (nếu có)','dose',obj.dose||'')}</div><div class="inline-note warning">Không dùng thuốc quá hạn. Số lượng được trừ khi đánh dấu đã dùng, không trừ khi chỉ tạo lịch kê đơn.</div>`;case 'baby':return `<div class="form-grid">${field('Tên bé','name','text',obj.name||'',{required:true,full:true,placeholder:'Ví dụ: Bông, Bảo An...'})}${field('Ngày tháng năm sinh','birthDate','date',obj.birthDate||t,{required:true,max:t})}${selectField('Giới tính','sex',obj.sex||'female',[['female','Bé gái'],['male','Bé trai'],['other','Khác / Không ghi']])}${field('Cân nặng lúc sinh (kg)','birthWeight','number',obj.birthWeight??'',{step:'.01',min:'.2',max:'15',required:true})}${field('Chiều dài lúc sinh (cm) · nếu có','birthLength','number',obj.birthLength??'',{step:'.1',min:'20',max:'90'})}</div>${isEdit?`<div class="inline-note danger">Muốn xóa hoàn toàn hồ sơ và mọi nhật ký của bé này? <button class="btn btn-small btn-danger" type="button" data-action="delete-baby" data-id="${esc(obj.id)}">Xóa hồ sơ bé</button></div>`:''}`;
case 'growth':return `<div class="form-grid">${field('Ngày đo','date','date',obj.date||t,{required:true,min:b?.birthDate||undefined,max:t})}${field('Cân nặng (kg)','weight','number',obj.weight??'',{step:'.01',min:'.2',max:'250',hint:'Có thể để trống nếu chỉ đo chiều cao'})}${field('Chiều cao (cm)','height','number',obj.height??'',{step:'.1',min:'20',max:'250'})}${area('Ghi chú','note',obj.note||'',{placeholder:'Ví dụ: Đo tại phòng khám'})}</div>`;
case 'formula':return `<div class="form-grid">${field('Tên sữa','name','text',obj.name||'',{required:true,full:true,placeholder:'Ghi đúng tên trên bao bì'})}${field('Từ tháng tuổi','ageFrom','number',obj.ageFrom??'',{min:0,max:216,step:1})}${field('Đến tháng tuổi','ageTo','number',obj.ageTo??'',{min:0,max:216,step:1})}${field('Số muỗng gạt / lần pha','scoops','number',obj.scoops??'',{min:0.1,max:50,step:'.1'})}${field('Lượng nước tương ứng (ml)','waterMl','number',obj.waterMl??'',{min:1,max:2000,step:1})}${area('Hướng dẫn / lưu ý từ bao bì','note',obj.note||'',{placeholder:'Nhiệt độ nước, lưu ý riêng trên hộp...'})}</div><div class="inline-note warning">Sao chép tỷ lệ từ đúng nhãn sản phẩm; không tự suy ra số muỗng dựa trên thông tin trong ứng dụng.</div>`;
case 'milk':return `<div class="form-grid">${field('Thời gian cữ sữa','dateTime','datetime-local',obj.dateTime||dt,{required:true})}${field('Số ml bé đã uống','ml','number',obj.ml??'',{required:true,min:0,max:3000,step:1})}${selectField('Chọn sữa đã lưu (tùy chọn)','formulaId',obj.formulaId||'',[['','Không chọn / nhập tên bên dưới'],...b.formulas.map(f=>[f.id,f.name])],{full:true})}${field('Tên sữa / ghi nhận bú mẹ','milkName','text',obj.milkName||'',{full:true,placeholder:'Ví dụ: Sữa A, sữa mẹ vắt'})}${area('Ghi chú cữ sữa','note',obj.note||'')}</div>`;
case 'meal':return `<div class="form-grid">${field('Thời gian ăn','dateTime','datetime-local',obj.dateTime||dt,{required:true})}${selectField('Loại bữa','type',obj.type||'Chính',[['Chính','Ăn dặm / Bữa chính'],['Phụ / ăn vặt','Bữa phụ / Ăn vặt']])}${field('Tên bữa ăn','name','text',obj.name||'',{required:true,full:true,placeholder:'Ví dụ: Bữa trưa, Bữa xế'})}${area('Thực đơn','menu',obj.menu||'',{required:true,placeholder:'Ví dụ: Cháo bí đỏ, thịt gà, rau xanh'})}${area('Ghi chú','note',obj.note||'',{placeholder:'Lượng ăn, phản ứng, thức ăn mới...'})}</div>`;
case 'vaccine':return `<div class="form-grid">${field('Tên mũi tiêm / vắc xin','name','text',obj.name||'',{required:true,full:true})}${field('Ngày dự kiến tiêm','planDate','date',obj.planDate||t,{required:true})}${field('Chi phí (VNĐ)','cost','number',obj.cost??'',{min:0,max:1000000000,step:1})}${area('Ghi chú trước tiêm','note',obj.note||'') }<div class="form-field full">${boolField('Đánh dấu: Bé đã tiêm', 'done',obj.done||false)}</div><div id="vaccine-actual" class="form-field full ${obj.done?'':'hidden'}">${field('Ngày thực tế đã tiêm','actualDate','date',obj.actualDate||'')}</div>${area('Theo dõi sau tiêm','postNote',obj.postNote||'',{placeholder:'Ví dụ: sốt, quấy khóc, phản ứng tại vị trí tiêm...'})}</div>`;
case 'fever':return `<div class="form-grid">${cabinetSelector(obj)}${field('Thời gian đo (có thể sửa)','dateTime','datetime-local',obj.dateTime||dt,{required:true,full:true})}${field('Nhiệt độ (°C)','temperature','number',obj.temperature??'',{required:true,min:30,max:45,step:'.1'})}<div class="form-field full">${boolField('Đã dùng thuốc hạ sốt (chỉ ghi nhận, không hướng dẫn liều)','medUsed',obj.medUsed||false)}</div>${field('Thời gian kiểm tra lại sau thuốc','followTime','datetime-local',obj.followTime||'')}${field('Nhiệt độ kiểm tra lại (°C)','followTemperature','number',obj.followTemperature??'',{min:30,max:45,step:'.1'})}${area('Ghi chú','note',obj.note||'')}</div><div class="inline-note warning">Nếu bé dưới 3 tháng tuổi có nhiệt độ từ 38°C, hoặc bé có dấu hiệu nguy hiểm như khó thở, co giật, li bì, hãy tìm hỗ trợ y tế ngay. Không tự ý dùng thuốc.</div>`;
case 'medicine':return `<div class="form-grid">${cabinetSelector(obj)}${selectField('Nhóm thuốc','kind',obj.kind||'rx',[['rx','Thuốc có kê đơn'],['otc','Thuốc không kê đơn']],{full:true})}${field('Tên thuốc','name','text',obj.name||'',{required:true,full:true})}${field('Liều dùng (ghi nguyên đơn / nhãn)','dose','text',obj.dose||'',{required:true,full:true,placeholder:'Ví dụ: 2,5 ml / lần theo đơn bác sĩ'})}<div class="form-field full"><div id="rx-part" class="form-grid ${obj.kind==='otc'?'hidden':''}">${field('Ngày bắt đầu','startDate','date',obj.startDate||t,{required:true})}${field('Số ngày dùng','days','number',obj.days??3,{required:true,min:1,max:120,step:1})}${field('Số lần mỗi ngày','frequency','number',obj.frequency??2,{required:true,min:1,max:8,step:1})}${field('Giờ dự kiến (cách nhau dấu phẩy)','timesText','text',Array.isArray(obj.times)?obj.times.join(', '):'',{placeholder:'Ví dụ: 08:00, 20:00',hint:'Nếu điền giờ, số mốc giờ phải bằng số lần/ngày'})}</div><div id="otc-part" class="form-grid ${obj.kind==='otc'?'':'hidden'}">${field('Ngày giờ đã dùng','dateTime','datetime-local',obj.dateTime||dt,{required:true,full:true})}</div></div>${field('Nhiệt độ bé (°C, nếu có)','temperature','number',obj.temperature??'',{min:30,max:45,step:'.1'})}${field('Chỉ số khác','indicators','text',obj.indicators||'',{placeholder:'Ví dụ: nhịp thở, tình trạng ăn ngủ'})}${area('Ghi chú / theo dõi','note',obj.note||'',{placeholder:'Triệu chứng, phản ứng, thông tin từ nhân viên y tế...'})}</div><div class="inline-note warning">Chỉ nhập lịch/liều đã được xác nhận. Các ô đánh dấu giúp ghi lại việc đã dùng, không nhắc giờ hoặc tự hướng dẫn điều trị.</div>`;
default:return ''}}
const modalNames={cabinet:'thuốc trong tủ',baby:'hồ sơ bé',growth:'số đo',formula:'loại sữa',milk:'cữ sữa',meal:'bữa ăn',vaccine:'mũi tiêm',medicine:'thuốc',fever:'cơn sốt'};
let currentModal=null;
function openModal(kind,entryId){const b=baby();const list=kind==='cabinet'?db.inventory:kind==='baby'?db.babies:arr(b?.[({growth:'growth',formula:'formulas',milk:'milk',meal:'meals',vaccine:'vaccines',medicine:'meds',fever:'fevers'})[kind]]);const obj=entryId?list.find(x=>x.id===entryId):null;const editing=Boolean(obj);currentModal={kind,entryId:editing?entryId:null};const root=$('#modal-root');root.innerHTML=`<div class="modal-backdrop" id="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-header"><h2 class="modal-title" id="dialog-title">${editing?'✏️ Chỉnh sửa':'＋ Thêm'} ${modalNames[kind]}</h2><button type="button" class="btn btn-small btn-ghost" data-action="close-modal" aria-label="Đóng">✕</button></div><form id="entry-form" class="modal-body"><div>${modalBody(kind,obj||{},editing)}</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Hủy</button><button type="submit" class="btn btn-primary">💾 ${editing?'Lưu thay đổi':'Lưu thông tin'}</button></div></form></div></div>`;document.body.style.overflow='hidden';if(kind==='medicine'){const isRx=root.querySelector('[name=kind]')?.value!=='otc';root.querySelectorAll('#rx-part input').forEach(input=>input.disabled=!isRx);root.querySelectorAll('#otc-part input').forEach(input=>input.disabled=isRx)}if(kind==='medicine'||kind==='fever')root.querySelector('#cabinet-choice')?.classList.toggle('hidden',!obj?.cabinetId);root.querySelector('input:not([type=checkbox]),select,textarea')?.focus()}
function closeModal(){currentModal=null;$('#modal-root').innerHTML='';document.body.style.overflow=''}
function readForm(form){const d=new FormData(form),v=n=>String(d.get(n)||'').trim(),n=n=>v(n)===''?null:Number(v(n));return {v,n,has:x=>d.has(x)}}
function handleSubmit(form){if(!currentModal)return;const {kind,entryId}=currentModal,b=baby(),{v,n,has}=readForm(form);let result=null;try{switch(kind){case 'cabinet':{if(!v('name')||!v('expiry')||!v('unit')||n('quantity')===null||n('quantity')<0)throw Error('Điền tên, hạn dùng, số lượng và đơn vị.');result={name:v('name'),expiry:v('expiry'),quantity:n('quantity'),unit:v('unit'),purpose:v('purpose'),dose:v('dose')};break}case 'baby':{if(!v('name'))throw Error('Hãy nhập tên bé.');if(!parseDate(v('birthDate'))||v('birthDate')>localDate())throw Error('Ngày sinh phải hợp lệ và không ở tương lai.');if(n('birthWeight')===null||n('birthWeight')<=0)throw Error('Hãy nhập cân nặng lúc sinh.');result={name:v('name'),birthDate:v('birthDate'),sex:v('sex'),birthWeight:n('birthWeight'),birthLength:n('birthLength')};break}
case 'growth':{if(v('date')<b.birthDate||v('date')>localDate())throw Error('Ngày đo phải từ ngày sinh đến hôm nay.');if(n('weight')==null&&n('height')==null)throw Error('Nhập ít nhất cân nặng hoặc chiều cao.');result={date:v('date'),weight:n('weight'),height:n('height'),note:v('note')};break}
case 'formula':{if(!v('name'))throw Error('Hãy nhập tên sữa.');if((n('scoops')===null)!==(n('waterMl')===null))throw Error('Để ghi tỷ lệ pha sữa, hãy nhập cả số muỗng và số ml nước.');if(n('ageTo')!=null&&n('ageFrom')!=null&&n('ageTo')<n('ageFrom'))throw Error('Độ tuổi kết thúc phải lớn hơn hoặc bằng độ tuổi bắt đầu.');result={name:v('name'),ageFrom:n('ageFrom'),ageTo:n('ageTo'),scoops:n('scoops'),waterMl:n('waterMl'),note:v('note')};break}
case 'milk':{const formula=b.formulas.find(x=>x.id===v('formulaId'));const milkName=v('milkName')||formula?.name||'';if(!milkName)throw Error('Hãy chọn hoặc nhập tên sữa.');result={dateTime:v('dateTime'),ml:n('ml'),formulaId:v('formulaId'),milkName,note:v('note')};break}
case 'meal':{result={dateTime:v('dateTime'),type:v('type'),name:v('name'),menu:v('menu'),note:v('note')};break}
case 'vaccine':{result={name:v('name'),planDate:v('planDate'),cost:n('cost')??0,note:v('note'),done:has('done'),actualDate:has('done')?(v('actualDate')||localDate()):'',postNote:v('postNote')};break}
case 'fever':{if(!v('dateTime'))throw Error('Hãy nhập thời gian đo.');if(n('temperature')===null||n('temperature')<30||n('temperature')>45)throw Error('Nhiệt độ cần trong khoảng 30–45°C.');if(v('followTime')&&!v('followTemperature'))throw Error('Hãy nhập nhiệt độ theo dõi sau dùng thuốc.');result={cabinetId:has('medUsed')&&v('source')==='cabinet'?v('cabinetId'):'',stockQty:n('stockQty')||1,dateTime:v('dateTime'),temperature:n('temperature'),medUsed:has('medUsed'),followTime:v('followTime'),followTemperature:n('followTemperature'),note:v('note')};break}
case 'medicine':{const previous=entryId?b.meds.find(m=>m.id===entryId):null;result={cabinetId:v('source')==='cabinet'?v('cabinetId'):'',stockQty:n('stockQty')||1,kind:v('kind'),name:v('name'),dose:v('dose'),temperature:n('temperature'),indicators:v('indicators'),note:v('note')};if(v('kind')==='rx'){const times=v('timesText').split(',').map(s=>s.trim()).filter(Boolean);if(times.length&&times.length!==n('frequency'))throw Error('Số giờ dự kiến phải trùng số lần dùng/ngày.');if(times.some(s=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(s)))throw Error('Giờ dự kiến phải dạng 08:00, 20:00.');result={...result,startDate:v('startDate'),days:n('days'),frequency:n('frequency'),times,taken:previous?.kind==='rx'?previous.taken||{}:{}};if(previous?.kind==='rx'&&(previous.startDate!==result.startDate||Number(previous.days)!==result.days||Number(previous.frequency)!==result.frequency)){if(!confirm('Bạn đã sửa ngày bắt đầu, số ngày hoặc số lần/ngày. Giữ các dấu tích cũ ở ngày/lần trùng khớp, các ô còn lại sẽ theo lịch mới?'))return}}
else{result={...result,dateTime:v('dateTime')}}break}
}if(!result)throw Error('Không thể lưu dữ liệu.');if((kind==='medicine'||kind==='fever')&&result.cabinetId){const item=db.inventory.find(x=>x.id===result.cabinetId);if(!item)throw Error('Hãy chọn thuốc trong tủ.');if(result.stockQty<=0)throw Error('Số lượng dùng phải lớn hơn 0.');if(kind==='medicine')result.name=item.name}if(kind==='medicine'||kind==='fever'){const old=entryId?(kind==='medicine'?b.meds:b.fevers).find(x=>x.id===entryId):null;validateStock(kind,old,result)}if(kind==='cabinet'){if(entryId){const i=db.inventory.findIndex(x=>x.id===entryId);if(i>=0)db.inventory[i]={...db.inventory[i],...result}}else db.inventory.push({id:id(),...result})}else if(kind==='baby'){if(entryId){const index=db.babies.findIndex(x=>x.id===entryId);if(index>=0)db.babies[index]={...db.babies[index],...result}}else{const newBaby=normalizeBaby({...result,id:id(),createdAt:new Date().toISOString()});db.babies.push(newBaby);selectedId=newBaby.id}}else{const table=({growth:'growth',formula:'formulas',milk:'milk',meal:'meals',vaccine:'vaccines',medicine:'meds',fever:'fevers'})[kind];if(entryId){const index=b[table].findIndex(x=>x.id===entryId);if(index>=0)b[table][index]={...b[table][index],...result}}else{b[table].push({id:id(),...result})}}save();closeModal();render();notify(entryId?'Đã lưu thay đổi.':'Đã thêm vào nhật ký.')}catch(e){notify(e.message||'Vui lòng kiểm tra lại thông tin.','error')}}
function removeEntry(kind,entryId){if(kind==='cabinet'){const item=db.inventory.find(x=>x.id===entryId);if(!item)return;if(!confirm('Xóa thuốc khỏi tủ? Các nhật ký dùng thuốc sẽ được giữ lại.'))return;db.inventory=db.inventory.filter(x=>x.id!==entryId);save();render();return}const b=baby(),key=({growth:'growth',formula:'formulas',milk:'milk',meal:'meals',vaccine:'vaccines',medicine:'meds',fever:'fevers'})[kind];if(!b||!key)return;const found=b[key].find(x=>x.id===entryId);if(!found)return;if(!confirm('Xóa '+modalNames[kind]+' này? Thao tác không thể hoàn tác nếu bạn chưa sao lưu.'))return;b[key]=b[key].filter(x=>x.id!==entryId);save();render();notify('Đã xóa bản ghi.');}
function deleteBaby(bid){const b=db.babies.find(x=>x.id===bid);if(!b)return;if(!confirm(`XÓA TOÀN BỘ hồ sơ của bé "${b.name}" và tất cả dữ liệu đi kèm?`))return;if(!confirm(`Xác nhận lần cuối: Xóa vĩnh viễn hồ sơ "${b.name}" trên thiết bị này?`))return;db.babies=db.babies.filter(x=>x.id!==bid);if(selectedId===bid)selectedId=db.babies[0]?.id||'';save();closeModal();render();notify('Đã xóa hồ sơ bé.')}
function exportJSON(){const data={app:'Be Yeu',version:1,exportedAt:new Date().toISOString(),babies:db.babies,inventory:db.inventory};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`be-yeu-sao-luu-${localDate()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Đã tạo bản sao lưu JSON.')}
async function importJSON(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('Tệp quá lớn (giới hạn 12 MB).');const raw=JSON.parse(await file.text());if(!raw||!Array.isArray(raw.babies))throw Error('Tệp JSON không đúng định dạng sao lưu Bé Yêu.');if(raw.babies.length>250)throw Error('Tệp chứa quá nhiều hồ sơ.');const incoming=raw.babies.map(x=>{if(!x||typeof x!=='object'||!String(x.name||'').trim()||!parseDate(x.birthDate))throw Error('Tệp có hồ sơ bé không hợp lệ.');return normalizeBaby(x)});if(importMode==='replace'){if(!confirm(`Khôi phục ${incoming.length} hồ sơ và THAY THẾ tất cả ${db.babies.length} hồ sơ hiện tại?`))return;db={version:1,babies:incoming,inventory:uniqueRecords(raw.inventory)};selectedId=db.babies[0]?.id||'';notify('Đã khôi phục dữ liệu từ tệp.')}else{const invIds=new Set(db.inventory.map(x=>x.id));for(const item of uniqueRecords(raw.inventory)){if(!invIds.has(item.id)){db.inventory.push(item);invIds.add(item.id)}}const ids=new Set(db.babies.map(x=>x.id));let count=0;for(const b of incoming){if(ids.has(b.id))continue;db.babies.push(b);ids.add(b.id);count++}if(!selectedId)selectedId=db.babies[0]?.id||'';notify(`Đã nhập thêm ${count} hồ sơ mới. ${incoming.length-count} hồ sơ trùng ID được bỏ qua.`)}save();render()}catch(e){notify(e.message||'Không thể đọc tệp JSON.','error')}finally{$('#import-input').value=''}}
$('#import-input').addEventListener('change',e=>importJSON(e.target.files?.[0]));
document.addEventListener('click',e=>{const hit=e.target.closest('[data-action]');if(!hit){if(e.target?.id==='modal-backdrop')closeModal();return}const act=hit.dataset.action;const kind=hit.dataset.kind,entryId=hit.dataset.id;switch(act){case 'tab':tab=hit.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'});break;case 'add':if(kind==='baby'||baby())openModal(kind);break;case 'edit':openModal(kind,entryId);break;case 'delete':removeEntry(kind,entryId);break;case 'close-modal':closeModal();break;case 'delete-baby':deleteBaby(entryId);break;case 'select-baby':selectedId=entryId;save();render();break;case 'food-mode':foodMode=hit.dataset.mode;render();break;case 'export':exportJSON();break;case 'import':importMode=hit.dataset.mode;$('#import-input').click();break;}});
document.addEventListener('change',e=>{const x=e.target;if(x.id==='baby-selector'){selectedId=x.value;save();render()}if(x.name==='kind'&&x.closest('#entry-form')){const rx=x.value==='rx';$('#rx-part')?.classList.toggle('hidden',!rx);$('#otc-part')?.classList.toggle('hidden',rx);$('#rx-part')?.querySelectorAll('input').forEach(i=>i.disabled=!rx);$('#otc-part')?.querySelectorAll('input').forEach(i=>i.disabled=rx)}if(x.name==='source'&&x.closest('#entry-form'))$('#cabinet-choice')?.classList.toggle('hidden',x.value!=='cabinet');if(x.name==='cabinetId'&&x.value&&$('#f-name')){const item=db.inventory.find(i=>i.id===x.value);if(item)$('#f-name').value=item.name}if(x.name==='formulaId'&&x.closest('#entry-form')){const formula=baby()?.formulas.find(f=>f.id===x.value);if(formula&&$('#f-milkName'))$('#f-milkName').value=formula.name}if(x.name==='done'&&x.closest('#entry-form'))$('#vaccine-actual')?.classList.toggle('hidden',!x.checked);if(x.dataset.action==='toggle-vaccine'){const v=baby()?.vaccines.find(m=>m.id===x.dataset.id);if(v){v.done=x.checked;v.actualDate=x.checked?(v.actualDate||localDate()):'';save();render();notify(x.checked?'Đã đánh dấu hoàn thành mũi tiêm.':'Đã chuyển về chưa hoàn thành.')}}if(x.dataset.action==='toggle-dose'){const m=baby()?.meds.find(a=>a.id===x.dataset.id);if(m&&m.kind==='rx'&&doseKeys(m).includes(x.dataset.slot)){m.taken=m.taken||{};if(x.checked){try{validateStock('medicine',m,{...m,taken:{...m.taken,[x.dataset.slot]:new Date().toISOString()}})}catch(err){x.checked=false;notify(err.message,'error');return}m.taken[x.dataset.slot]=new Date().toISOString()}else delete m.taken[x.dataset.slot];const opened=[...document.querySelectorAll('details[data-medid][open]')].map(el=>el.dataset.medid);save();render();opened.forEach(mid=>{const el=[...document.querySelectorAll('details[data-medid]')].find(node=>node.dataset.medid===mid);if(el)el.open=true});notify(x.checked?'Đã đánh dấu lần dùng thuốc.':'Đã bỏ dấu lần dùng.')}}});
document.addEventListener('submit',e=>{if(e.target.id==='entry-form'){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentModal)closeModal()});
render();
</script>
</body>
</html>
